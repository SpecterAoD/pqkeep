[package]
name = "pqkeep-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Narrow synchronous platform adapters for PQKeep"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ErrorReporting", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse"] }

[dependencies.zeroize]
version = "1.9.1"
default-features = false

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Security_Authorization"] }

[features]
# DE/EN: Ausschließlich feste öffentliche Testereignisse / fixed public test events only.
native-input-fixture = []
# DE/EN: Nur lesende eigene Seitensperrprobe / read-only own page-lock fixture only.
native-memory-fixture = []
# DE/EN: Nur lesende direkte Find-Metadatenprobe / read-only direct find-metadata fixture.
native-metadata-fixture = []
# DE/EN: Nur ausdrücklich gestartete öffentliche Prozessprobe / explicitly run public probe only.
process-access-probe = []

[[example]]
name = "process_access_probe"
required-features = ["process-access-probe"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
