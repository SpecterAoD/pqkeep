# DE: cargo-deny: Advisories, Lizenzen (Apache-2.0-kompatibel) und Quellen.
# EN: cargo-deny: advisories, licenses (Apache-2.0 compatible) and sources.

[graph]
all-features = true

[advisories]
# DE: Unbetreute und zurückgezogene Crates ebenfalls als Fehler.
# EN: Unmaintained and yanked crates are errors as well.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# DE: Nur OSI-anerkannte, mit Apache-2.0 kompatible Lizenzen; GPL/AGPL ausgeschlossen.
# EN: Only OSI-approved licenses compatible with Apache-2.0; GPL/AGPL excluded.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# DE: Allowlist darf Lizenzen enthalten, die (noch) nicht vorkommen.
# EN: The allowlist may contain licenses not (yet) in use.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# DE: Nur crates.io, keine Git-Quellen oder fremden Registries.
# EN: crates.io only, no git sources or foreign registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
