[package]
name = "pqkeep"
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Post-quantum file encryption, signatures and key storage (ML-KEM, ML-DSA, AES-256-GCM, Argon2id): CLI and library"
repository = "https://github.com/SpecterAoD/pqkeep"
homepage = "https://github.com/SpecterAoD/pqkeep"
documentation = "https://docs.rs/pqkeep"
readme = "README.md"
keywords = ["post-quantum", "ml-kem", "ml-dsa", "encryption", "cli"]
categories = ["cryptography", "command-line-utilities"]
# DE: Nur was zum Bauen und für die Lizenz nötig ist (keine Tests, Skripte, Workflows).
# EN: Only what is needed to build and for the licence (no tests, scripts, workflows).
include = [
    "/src/**",
    "/data/wordlists/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
]
# DE: Veröffentlichung auf crates.io erst nach ausdrücklicher Entscheidung (#71).
# EN: Publishing to crates.io only after an explicit decision (#71).
publish = false

[workspace]
members = ["platform/pqkeep-platform"]
default-members = ["."]
exclude = [
    "vendor/base64ct-1.8.3",
    "vendor/argon2-0.6.0", "vendor/blake2-0.11.0",
    "vendor/axum-0.8.9", "vendor/hyper-1.12.0", "vendor/hyper-util-0.1.21",
    "vendor/serde_json-1.0.154", "vendor/hkdf-0.13.0", "vendor/hmac-0.13.0",
    "vendor/region-4.0.1", "vendor/ml-kem-0.3.4", "vendor/ml-dsa-0.1.2",
    "vendor/module-lattice-0.2.4", "vendor/shake-0.1.0", "vendor/sha3-0.12.0",
    "vendor/aes-0.9.2", "vendor/aes-gcm-0.11.1", "vendor/ghash-0.6.0", "vendor/polyval-0.7.3",
    "vendor/keccak-0.2.2", "vendor/sponge-cursor-0.1.0", "fuzz",
]
resolver = "3"

[lib]
name = "pqkeep"
path = "src/lib.rs"

[[bin]]
name = "pqkeep"
path = "src/main.rs"

# DE: Startprogramm ohne Konsolenfenster für das Kontextmenü unter Windows (U4-3b).
# EN: Launcher without a console window for the context menu on Windows (U4-3b).
[[bin]]
name = "pqkeepw"
path = "src/bin/pqkeepw.rs"

[dependencies]
aes-gcm = { version = "0.11.1", path = "vendor/aes-gcm-0.11.1", default-features = false, features = ["aes", "alloc", "zeroize", "protected-workspace"] }
argon2 = { version = "0.6.0", path = "vendor/argon2-0.6.0", default-features = false, features = ["alloc", "zeroize", "parallel", "protected-workspace"] }
axum = { version = "0.8.9", path = "vendor/axum-0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
base64ct = { version = "1.8.3", path = "vendor/base64ct-1.8.3", features = ["alloc"] }
# DE: Derselbe versionierte geschützte Blake2-Pfad auch für externe Consumer.
# EN: The same versioned protected Blake2 path also applies to external consumers.
blake2 = { version = "0.11.0", path = "vendor/blake2-0.11.0", default-features = false, features = ["zeroize", "protected-workspace"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = { version = "0.13.0", path = "vendor/hkdf-0.13.0" }
hmac = { version = "0.13.0", path = "vendor/hmac-0.13.0", features = ["zeroize"] }
hyper = { version = "1.12.0", path = "vendor/hyper-1.12.0", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.21", path = "vendor/hyper-util-0.1.21", default-features = false, features = ["tokio"], optional = true }
mime = { version = "0.3.18", optional = true }
ml-dsa = { version = "0.1.2", path = "vendor/ml-dsa-0.1.2", default-features = false, features = ["zeroize", "rand_core", "alloc", "protected-workspace"] }
ml-kem = { version = "0.3.4", path = "vendor/ml-kem-0.3.4", default-features = false, features = ["zeroize", "getrandom", "protected-workspace"] }
region = { version = "4.0.1", path = "vendor/region-4.0.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", path = "vendor/serde_json-1.0.154" }
sha3 = { version = "0.12.0", path = "vendor/sha3-0.12.0", features = ["zeroize", "protected-workspace"] }
subtle = "2.6.1"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "signal", "sync"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["util"], optional = true }
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
too_many_lines = "warn"

# DE: Überlauf-Prüfungen auch im Release; LTO und strip für kleinere, gehärtete Binaries.
# EN: Overflow checks in release too; LTO and strip for smaller, hardened binaries.
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = true
# DE: Bei Panik sofort beenden (kein Unwinding). Destruktoren laufen dann nicht, Geheimnisse
#     werden nicht genullt; der Speicher geht direkt ans Betriebssystem zurück, Core Dumps
#     sind gesperrt (siehe docs/MEMORY_HARDENING.md). Tests nutzen weiter Unwinding.
# EN: Abort immediately on panic (no unwinding). Destructors do not run, so secrets are not
#     zeroed; memory goes straight back to the OS and core dumps are disabled (see
#     docs/MEMORY_HARDENING.md). Tests keep using unwinding.
panic = "abort"

[dev-dependencies]
sponge-cursor = { version = "0.1.0", path = "vendor/sponge-cursor-0.1.0" }
shake = { version = "0.1.0", path = "vendor/shake-0.1.0", features = ["protected-workspace"] }
module-lattice = { version = "0.2.4", path = "vendor/module-lattice-0.2.4", features = ["zeroize"] }
hex = "0.4"
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.191"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "termios", "event", "thread", "fs"] }
seccompiler = { version = "0.5.0", default-features = false }

# DE: Kontextmenü unter Windows (HKCU). 0.6.x, da neuere Versionen Rust 1.95 verlangen (MSRV 1.88).
# EN: Context menu on Windows (HKCU). 0.6.x since newer versions require Rust 1.95 (MSRV 1.88).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
pqkeep-platform = { version = "0.1.0", path = "platform/pqkeep-platform" }

[target.'cfg(windows)'.dev-dependencies]
# DE: Nur sichere eigene Testfixture, nicht im normalen Produktionsbaum.
# EN: Safe own-console fixture only, excluded from normal production features.
pqkeep-platform = { version = "0.1.0", path = "platform/pqkeep-platform", features = ["native-input-fixture", "native-memory-fixture"] }

# DE: `api` (Standard) baut den REST-Server `pqkeep serve` ein. Ohne das Feature
#     (`--no-default-features`) entsteht eine reine CLI ohne Netzwerkcode.
# EN: `api` (default) builds in the REST server `pqkeep serve`. Without the feature
#     (`--no-default-features`) a pure CLI without network code is built.
[features]
default = ["api"]
api = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tower", "dep:mime"]

# DE: Abhängigkeiten auch im Debug/Test-Build optimieren (Argon2 sonst extrem langsam).
#     Betrifft nur die Laufzeit, nicht die Semantik; eigener Code bleibt unoptimiert.
# EN: Optimise dependencies in debug/test builds too (Argon2 is extremely slow otherwise).
#     Affects run time only, not semantics; own code stays unoptimised.
[profile.dev.package."*"]
opt-level = 3
