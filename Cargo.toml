[package]
name = "pqkeep"
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Post-quantum key generation and storage (ML-KEM, ML-DSA, AES-256)"
repository = "https://github.com/SpecterAoD/pqkeep"
publish = false

[lib]
name = "pqkeep"
path = "src/lib.rs"

[[bin]]
name = "pqkeep"
path = "src/main.rs"

# DE: Startprogramm ohne Konsolenfenster für das Kontextmenü unter Windows (U4-3b).
# EN: Launcher without a console window for the context menu on Windows (U4-3b).
[[bin]]
name = "pqkeepw"
path = "src/bin/pqkeepw.rs"

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize", "parallel"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
base64ct = { version = "1.8.3", features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"], optional = true }
ml-dsa = { version = "0.1.2", default-features = false, features = ["zeroize", "rand_core", "alloc"] }
ml-kem = { version = "0.3.4", default-features = false, features = ["zeroize", "getrandom"] }
region = "4.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
subtle = { version = "2.6.1", optional = true }
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "signal", "sync"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["util"], optional = true }
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
too_many_lines = "warn"

# DE: Überlauf-Prüfungen auch im Release; LTO und strip für kleinere, gehärtete Binaries.
# EN: Overflow checks in release too; LTO and strip for smaller, hardened binaries.
[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = true
# DE: Bei Panik sofort beenden (kein Unwinding). Destruktoren laufen dann nicht, Geheimnisse
#     werden nicht genullt; der Speicher geht direkt ans Betriebssystem zurück, Core Dumps
#     sind gesperrt (siehe docs/MEMORY_HARDENING.md). Tests nutzen weiter Unwinding.
# EN: Abort immediately on panic (no unwinding). Destructors do not run, so secrets are not
#     zeroed; memory goes straight back to the OS and core dumps are disabled (see
#     docs/MEMORY_HARDENING.md). Tests keep using unwinding.
panic = "abort"

[dev-dependencies]
hex = "0.4"
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.191"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
seccompiler = { version = "0.5.0", default-features = false }

# DE: Kontextmenü unter Windows (HKCU). 0.6.x, da neuere Versionen Rust 1.95 verlangen (MSRV 1.88).
# EN: Context menu on Windows (HKCU). 0.6.x since newer versions require Rust 1.95 (MSRV 1.88).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

# DE: `api` (Standard) baut den REST-Server `pqkeep serve` ein. Ohne das Feature
#     (`--no-default-features`) entsteht eine reine CLI ohne Netzwerkcode.
# EN: `api` (default) builds in the REST server `pqkeep serve`. Without the feature
#     (`--no-default-features`) a pure CLI without network code is built.
[features]
default = ["api"]
api = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tower", "dep:subtle"]

# DE: Abhängigkeiten auch im Debug/Test-Build optimieren (Argon2 sonst extrem langsam).
#     Betrifft nur die Laufzeit, nicht die Semantik; eigener Code bleibt unoptimiert.
# EN: Optimise dependencies in debug/test builds too (Argon2 is extremely slow otherwise).
#     Affects run time only, not semantics; own code stays unoptimised.
[profile.dev.package."*"]
opt-level = 3
