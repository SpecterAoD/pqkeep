# DE: OpenSSF Scorecard (#185): bewertet die Lieferketten-Sicherheit des Repositorys (Token-Rechte,
#     Pinning, Branch-Schutz, signierte Releases, Fuzzing …) und veröffentlicht das Ergebnis für das
#     Kennzeichen in der README; Funde erscheinen unter Security → Code scanning. Läuft nur auf
#     `main`, wöchentlich und bei Änderungen am Branch-Schutz – nie für Pull Requests, daher ohne
#     fremden Code. Schreibrechte nur im Job: SARIF hochladen, OIDC für die Veröffentlichung.
# EN: OpenSSF Scorecard (#185): rates the repository's supply-chain security (token permissions,
#     pinning, branch protection, signed releases, fuzzing …) and publishes the result for the README
#     badge; findings appear under Security → Code scanning. Runs only on `main`, weekly and on
#     branch protection changes – never for pull requests, so no foreign code. Write permissions in
#     the job only: upload SARIF, OIDC for publishing.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
