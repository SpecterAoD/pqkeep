# DE: CodeQL-Analyse (Rust, Python-Skripte, GitHub Actions) mit eigener Konfiguration
#     (Testdateien ausgenommen, siehe .github/codeql/codeql-config.yml). Ersetzt die
#     Standardeinrichtung von GitHub. Bei Push auf main, Pull Requests und wöchentlich.
# EN: CodeQL analysis (Rust, Python scripts, GitHub Actions) with own configuration
#     (test files excluded, see .github/codeql/codeql-config.yml). Replaces GitHub's
#     default setup. On push to main, pull requests and weekly.
name: CodeQL

on:
  push:
    branches: [main, security/opencode-issue-agent-hardening]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
