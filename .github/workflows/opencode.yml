# SECURITY HOLD: only the authorization preflight is enabled.
# Gemini agent execution and PR publication are deliberately disabled until
# container egress isolation, patch artifact verification and publisher gates
# have passed review. This workflow never receives GEMINI_API_KEY.
name: OpenCode Issue Agent - authorization only

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'SpecterAoD/pqkeep' &&
      github.event.issue.pull_request == null &&
      github.event.sender.id == 77644070 &&
      github.event.sender.type == 'User' &&
      github.event.comment.user.id == 77644070 &&
      github.event.issue.user.id == 77644070 &&
      github.event.comment.body == '/oc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate event without executing issue text
        run: python3 scripts/authorize_opencode.py
      - name: Revalidate against GitHub API
        env:
          GH_READ_TOKEN: ${{ github.token }}
          OPENCODE_SNAPSHOT_PATH: ${{ runner.temp }}/opencode-issue-snapshot.json
        run: python3 scripts/revalidate_opencode_event.py
      - name: Security hold
        run: |
          echo "::notice::Authorization passed. AI execution is intentionally disabled."
          echo "::notice::No Gemini key was accessed; no code was modified or pushed."
