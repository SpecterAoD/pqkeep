# DE: Release-Workflow (SPEC 5a). Auslöser:
#     - signierter Tag `v*`: Tag-Signatur und Version werden geprüft, Ergebnis ist ein Release-ENTWURF,
#       den der Maintainer nach grüner Prüfung von Hand veröffentlicht;
#     - manuell (`workflow_dispatch`): Trockenlauf mit allen Schritten außer dem GitHub-Release;
#     - Pull Requests, die diesen Workflow oder die Release-Skripte ändern: nur Build, Rauchtest,
#       Paket und SBOM (ohne Attestation, Signatur, Veröffentlichung).
#     Schreibrechte, Attestationen und OIDC (Sigstore) gibt es nur im Job `publish`, der über das
#     Environment `release` die Freigabe des Maintainers braucht.
# EN: Release workflow (SPEC 5a). Triggers:
#     - signed tag `v*`: tag signature and version are checked, the result is a release DRAFT that
#       the maintainer publishes manually after verification passed;
#     - manual (`workflow_dispatch`): dry run with all steps except the GitHub release;
#     - pull requests changing this workflow or the release scripts: build, smoke test, package
#       and SBOM only (no attestation, signature, publishing).
#     Write access, attestations and OIDC (Sigstore) exist only in job `publish`, which needs the
#     maintainer's approval via the `release` environment.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_*.py"
      - "scripts/test_release_*.py"
      - "scripts/check_binary.py"
      - "tests/hardening_memlock.rs"
      - "packaging/debian/**"
      - "docs/INSTALL.md"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CYCLONEDX_VERSION: "0.5.9"
  COSIGN_VERSION: "v3.1.4"

jobs:
  prepare:
    name: Vorbereitung / prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skript-Tests / script tests
        run: |
          python3 scripts/test_release_scripts.py
          python3 -m unittest discover -s scripts -p 'test_release_elf.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_deb*.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_manifest.py' -v
      - name: Version, Zeitstempel, Tag-Signatur / version, timestamp, tag signature
        id: meta
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          { echo "epoch=$(git log -1 --format=%ct)"; } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            # DE: Annotierten Tag sicher holen und Signatur gegen allowed_signers prüfen.
            # EN: Fetch the annotated tag and verify its signature against allowed_signers.
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git config gpg.ssh.allowedSignersFile .github/allowed_signers
            git verify-tag "$tag"
            if [ "v$cargo_version" != "$tag" ]; then
              echo "Tag $tag passt nicht zu Cargo.toml $cargo_version / tag does not match" >&2
              exit 1
            fi
            # DE: Zweisprachige Release-Notes sind Pflicht (Release-Checkliste).
            # EN: Bilingual release notes are mandatory (release checklist).
            if [ ! -f "docs/releases/$tag.md" ]; then
              echo "docs/releases/$tag.md fehlt / is missing" >&2
              exit 1
            fi
            case "$cargo_version" in *-*) pre=true ;; *) pre=false ;; esac
            {
              echo "version=$cargo_version"
              echo "is_tag=true"
              echo "prerelease=$pre"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "version=$cargo_version-dev.$(git rev-parse --short=7 HEAD)"
              echo "is_tag=false"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # DE: Ubuntu 22.04 (glibc 2.35) für breite Kompatibilität. EN: for wide compatibility.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: dist-x86_64-unknown-linux-gnu
            deb_arch: amd64
            exe: pqkeep
            extra: ""
            flags: ""
          # DE: RUSTFLAGS überschreibt .cargo/config.toml – CFG daher hier ausdrücklich.
          # EN: RUSTFLAGS overrides .cargo/config.toml – hence CFG explicitly here.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dist-x86_64-pc-windows-msvc
            deb_arch: ""
            exe: pqkeep.exe
            # DE: Startprogramm ohne Konsolenfenster (Kontextmenü). EN: Launcher without console window.
            extra: pqkeepw.exe
            flags: "-C control-flow-guard"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: dist-aarch64-unknown-linux-gnu
            deb_arch: arm64
            exe: pqkeep
            extra: ""
            flags: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_TAG: ${{ needs.prepare.outputs.is_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Reproduzierbare Pfade / reproducible paths
        run: |
          if command -v cygpath >/dev/null; then ws=$(cygpath -w "$PWD"); ch=$(cygpath -w "$HOME/.cargo"); else ws="$PWD"; ch="$HOME/.cargo"; fi
          echo "RUSTFLAGS=--remap-path-prefix=$ws=/build --remap-path-prefix=$ch=/cargo ${{ matrix.flags }}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Native ELF-Architektur und glibc-Basis
        if: runner.os == 'Linux'
        run: |
          uname -a
          getconf PAGESIZE
          getconf GNU_LIBC_VERSION
          rustc -vV
          cargo --version
          cc --version
          ld --version
          sha256sum Cargo.lock
          printf 'Runner image: %s\n' "$ImageVersion"
          python3 scripts/release_elf.py "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${{ matrix.target }}" --native
      - name: Härtung prüfen / check hardening
        run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          for exe in ${{ matrix.exe }} ${{ matrix.extra }}; do
            "$py" scripts/check_binary.py "target/${{ matrix.target }}/release/$exe"
          done
      - name: Rauchtest / smoke test
        run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" scripts/release_smoke.py "target/${{ matrix.target }}/release/${{ matrix.exe }}"
      # DE: Platz für die Windows-Signatur (SignPath) nach deren Zusage – vor dem Verpacken.
      # EN: Place for the Windows signature (SignPath) after approval – before packaging.
      - name: Paket / package
        run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" scripts/release_package.py "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$VERSION" "${{ matrix.target }}" dist
      - name: SBOM (CycloneDX)
        run: |
          sha256sum Cargo.lock > "$RUNNER_TEMP/pqkeep-lock.sha256"
          cargo install --locked cargo-cyclonedx --version "$CYCLONEDX_VERSION"
          cargo cyclonedx --format json --spec-version 1.5 --target "${{ matrix.target }}" \
            --override-filename "pqkeep-$VERSION-${{ matrix.target }}.cdx"
          mv "pqkeep-$VERSION-${{ matrix.target }}.cdx.json" dist/
          # DE: serialNumber (von actions/attest verlangt) und reproduzierbarer Zeitstempel.
          # EN: serialNumber (required by actions/attest) and reproducible timestamp.
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" scripts/release_sbom.py "dist/pqkeep-$VERSION-${{ matrix.target }}.cdx.json" \
            "$VERSION" "${{ matrix.target }}" "$GITHUB_SHA"
          sha256sum -c "$RUNNER_TEMP/pqkeep-lock.sha256"
          ls -l dist
      - name: Identität des verpackten Linux-Binaries
        if: runner.os == 'Linux'
        run: |
          python3 scripts/release_elf.py "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${{ matrix.target }}" \
            --archive "dist/pqkeep-$VERSION-${{ matrix.target }}.tar.gz"
      - name: Debian-Paket und reproduzierbares Verpacken
        if: matrix.deb_arch != ''
        run: |
          dpkg-deb --version
          dpkg-shlibdeps --version
          binary="target/${{ matrix.target }}/release/pqkeep"
          # DE: Signierter Tag: Release-Version ohne CI-Suffix. Sonst CI-Kandidat; das
          #     Nachfolger-Testpaket trägt dann die Release-Version und prüft so auch diesen Weg.
          # EN: Signed tag: release version without CI suffix. Otherwise CI candidate; the
          #     successor test package then carries the release version and covers that path.
          if [ "$IS_TAG" = "true" ]; then kind=(--release); next=(--release --successor); else kind=(); next=(--release); fi
          python3 scripts/release_deb.py "$binary" "${{ matrix.target }}" deb-dist --ci-sha "$GITHUB_SHA" "${kind[@]}"
          python3 scripts/release_deb.py "$binary" "${{ matrix.target }}" deb-repeat --ci-sha "$GITHUB_SHA" "${kind[@]}"
          cmp deb-dist/*.deb deb-repeat/*.deb
          # Nachfolger-Testpaket nur für Upgrade-/Downgrade-Prüfungen: gleiches Binary, höhere
          # Version. Wird nie veröffentlicht (Artefaktname außerhalb dist-*).
          python3 scripts/release_deb.py "$binary" "${{ matrix.target }}" deb-next --ci-sha "$GITHUB_SHA" "${next[@]}"
          deb=$(ls deb-dist/*.deb)
          dpkg --compare-versions "$(dpkg-deb -f "$deb" Version)" lt "$(dpkg-deb -f deb-next/*.deb Version)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # DE: Release-Dateiname ohne Tilde (GitHub ersetzt sie in Asset-Namen) und eigene SBOM.
          # EN: Release file name without tilde (GitHub replaces it in asset names) and own SBOM.
          asset="dist/pqkeep-$VERSION-${{ matrix.deb_arch }}.deb"
          cp "$deb" "$asset"
          python3 scripts/release_sbom.py --deb "dist/pqkeep-$VERSION-${{ matrix.target }}.cdx.json" \
            "$asset.cdx.json" "$(dpkg-deb -f "$deb" Version)" "${{ matrix.deb_arch }}" \
            "$(sha256sum "$binary" | cut -d' ' -f1)" "$GITHUB_SHA"
          sha256sum "$deb" "$asset"
      - name: Debian-Kandidat getrennt bereitstellen
        if: matrix.deb_arch != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-debian-${{ matrix.deb_arch }}
          path: deb-dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Nachfolger-Testpaket getrennt bereitstellen
        if: matrix.deb_arch != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-debian-${{ matrix.deb_arch }}
          path: deb-next/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  debian:
    name: Debian-Installation ${{ matrix.arch }} (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
        include:
          # `other`: Paket der jeweils anderen Architektur; es muss abgewiesen werden.
          - arch: amd64
            runner: ubuntu-22.04
            other: arm64
          - arch: arm64
            runner: ubuntu-22.04-arm
            other: amd64
          # Offizielle Image-Digests am 10.11.2026 (Debian 12, Ubuntu 22.04) und 12.11.2026
          # geprüft; keine beweglichen Tags allein.
          # Alle OCI-Indizes enthalten native amd64- und arm64/v8-Manifeste.
          - distro: debian12
            name: Debian 12
            image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
          - distro: debian13
            name: Debian 13
            image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
          - distro: ubuntu22
            name: Ubuntu 22.04
            image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          - distro: ubuntu24
            name: Ubuntu 24.04
            image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
          - distro: ubuntu26
            name: Ubuntu 26.04
            image: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    # Kurzlebige native Testcontainer; keine privilegierten Optionen oder gelockerten Filter.
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-debian-${{ matrix.arch }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-debian-${{ matrix.arch }}
          path: successor
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-debian-${{ matrix.other }}
          path: foreign
      - name: Werkzeuge ausschließlich im Testcontainer
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 lintian
          cat /etc/os-release
          dpkg-deb --version
          lintian --version
      - name: Lintian ohne Overrides
        run: lintian --allow-root --fail-on error candidate/*.deb successor/*.deb
      - name: Native Installation, Nutzung und Entfernung
        run: python3 scripts/release_deb_smoke.py candidate/*.deb --arch "${{ matrix.arch }}"
      - name: Lebenszyklus – Abweisungen, Upgrade, Downgrade, Wiederherstellung, Purge
        run: |
          python3 scripts/release_deb_lifecycle.py candidate/*.deb successor/*.deb foreign/*.deb \
            --arch "${{ matrix.arch }}"

  # DE: Läuft auch in PRs und ohne Rechte: gleicht die Build-Artefakte mit dem Manifest ab.
  #     Nur dessen Ergebnis wird signiert; Kandidaten- und Testpakete gehören nicht dazu.
  # EN: Also runs in PRs and without permissions: checks the build artifacts against the
  #     manifest. Only its result gets signed; candidate and test packages are not part of it.
  manifest:
    name: Artefaktmanifest / artifact manifest
    needs: [prepare, build, debian]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: downloads
      - name: Manifest abgleichen / check manifest
        run: |
          ls -lR downloads
          python3 scripts/release_manifest.py collect downloads dist "$VERSION" "$GITHUB_SHA"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-input
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Signieren und bereitstellen / sign and stage
    needs: [prepare, manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # DE: Nur die Release-Notes werden aus dem Repository gebraucht.
      # EN: Only the release notes are needed from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-input
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: dist/pqkeep-${{ env.VERSION }}-x86_64-unknown-linux-gnu.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-x86_64-pc-windows-msvc.zip
          sbom-path: dist/pqkeep-${{ env.VERSION }}-x86_64-pc-windows-msvc.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz
          sbom-path: dist/pqkeep-${{ env.VERSION }}-aarch64-unknown-linux-gnu.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-amd64.deb
          sbom-path: dist/pqkeep-${{ env.VERSION }}-amd64.deb.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-arm64.deb
          sbom-path: dist/pqkeep-${{ env.VERSION }}-arm64.deb.cdx.json
      - name: Prüfsummen / checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *.deb *.cdx.json | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sigstore-Signaturen (ohne gespeicherte Schlüssel) / keyless signatures
        working-directory: dist
        run: |
          for f in *.tar.gz *.zip *.deb SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Release-Entwurf / release draft
        if: needs.prepare.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          pre=()
          if [ "$IS_PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${pre[@]}" \
            --title "PQKeep $TAG" --notes-file "docs/releases/$TAG.md"

  verify:
    name: Prüfung / verification
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - name: Manifest des Bündels / bundle manifest
        run: python3 scripts/release_manifest.py verify dist "$VERSION"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Prüfsummen / checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Build-Attestationen / build attestations
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in *.tar.gz *.zip *.deb; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom
          done
      - name: Sigstore-Signaturen / Sigstore signatures
        working-directory: dist
        env:
          SIGNER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          id="https://github.com/$SIGNER_WORKFLOW_REF"
          for f in *.tar.gz *.zip *.deb SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$id" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
