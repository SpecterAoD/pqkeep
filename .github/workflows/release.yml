# DE: Release-Workflow (SPEC 5a). Auslöser:
#     - signierter Tag `v*`: Tag-Signatur und Version werden geprüft, Ergebnis ist ein Release-ENTWURF,
#       der erst nach vollständiger Prüfung entsteht und manuell veröffentlicht wird;
#     - manuell (`workflow_dispatch`): Trockenlauf mit allen Schritten außer dem GitHub-Release;
#     - Pull Requests, die diesen Workflow oder die Release-Skripte ändern: nur Build, Rauchtest,
#       Paket und SBOM (ohne Attestation, Signatur, Veröffentlichung).
#     Schreibrechte, Attestationen und OIDC (Sigstore) gibt es nur im Job `publish` (Signieren) und `draft` (Release-Schreiben), der über das
#     Environment `release` die Freigabe des Maintainers braucht.
# EN: Release workflow (SPEC 5a). Triggers:
#     - signed tag `v*`: tag signature and version are checked, the result is a release DRAFT created only after complete verification and published manually;
#     - manual (`workflow_dispatch`): dry run with all steps except the GitHub release;
#     - pull requests changing this workflow or the release scripts: build, smoke test, package
#       and SBOM only (no attestation, signature, publishing).
#     Write access, attestations and OIDC (Sigstore) exist only in job `publish` (signing) and `draft` (release writes), which needs the
#     maintainer's approval via the `release` environment.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/build.yml"
      - "scripts/release_*.py"
      - "scripts/test_release_*.py"
      - "scripts/check_binary.py"
      - "tests/hardening_memlock.rs"
      - "packaging/debian/**"
      - "docs/INSTALL.md"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  COSIGN_VERSION: "v3.1.4"

jobs:
  prepare:
    name: Vorbereitung / prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skript-Tests / script tests
        run: |
          python3 scripts/test_release_scripts.py
          python3 -m unittest discover -s scripts -p 'test_release_trust*.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_ref.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_elf.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_deb*.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_manifest.py' -v
      # DE/EN: Temporäre, rein lesende Abnahme; vor finalem PR-Stand entfernen / temporary read-only acceptance.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request'
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-trial
          run-id: 44838948198
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'pull_request'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Reale Trust-Gegenproben / live trust probes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_DIST: ${{ runner.temp }}/release-trial
        run: >-
          python3 scripts/release_trust_probe.py "$TRIAL_DIST" 0.1.0-beta.3-dev.bc17cff
          SpecterAoD/pqkeep refs/heads/main bc17cffabec5413b6b96a7c94a2cd3e682afe31d
      - name: Version, Zeitstempel, Tag-Signatur / version, timestamp, tag signature
        id: meta
        run: python3 scripts/release_ref.py

  # DE: Build, Pakete, Installationstests und Manifest liegen in build.yml (gemeinsam mit preview.yml).
  #     Signierung und Veröffentlichung bleiben hier.
  # EN: Build, packages, installation tests and manifest live in build.yml (shared with preview.yml).
  #     Signing and publishing stay here.
  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] -- gleicher Commit wie der Aufrufer / same commit as the caller
    with:
      version: ${{ needs.prepare.outputs.version }}
      epoch: ${{ needs.prepare.outputs.epoch }}
      is_tag: ${{ needs.prepare.outputs.is_tag }}

  publish:
    name: Signieren und bereitstellen / sign and stage
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # DE: Nur die Release-Notes werden aus dem Repository gebraucht.
      # EN: Only the release notes are needed from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-input
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: dist/pqkeep-${{ env.VERSION }}-x86_64-unknown-linux-gnu.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-x86_64-pc-windows-msvc.zip
          sbom-path: dist/pqkeep-${{ env.VERSION }}-x86_64-pc-windows-msvc.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz
          sbom-path: dist/pqkeep-${{ env.VERSION }}-aarch64-unknown-linux-gnu.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-amd64.deb
          sbom-path: dist/pqkeep-${{ env.VERSION }}-amd64.deb.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/pqkeep-${{ env.VERSION }}-arm64.deb
          sbom-path: dist/pqkeep-${{ env.VERSION }}-arm64.deb.cdx.json
      - name: Prüfsummen / checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *.deb *.cdx.json | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sigstore-Signaturen (ohne gespeicherte Schlüssel) / keyless signatures
        working-directory: dist
        run: |
          for f in *.tar.gz *.zip *.deb SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      # DE: Provenance aller Artefakte als Release-Anhang (#238; Scorecard „Signed-Releases“). Das
      #     Bundle ist selbst signiert und wird im Job „Prüfung“ gegen jedes Artefakt geprüft.
      # EN: Provenance of all artifacts as a release asset (#238; Scorecard "Signed-Releases"). The
      #     bundle is itself signed and verified against every artifact in the "verification" job.
      - name: Provenance als Anhang / provenance as asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "dist/pqkeep-$VERSION.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Prüfung / verification
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Vollständige Verifikation / complete verification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 scripts/release_trust.py dist "$VERSION" "$GITHUB_REPOSITORY" "$EXPECTED_REF" "$EXPECTED_COMMIT"

  draft:
    name: Geprüfter Release-Entwurf / verified release draft
    needs: [prepare, verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Schreibgrenze erneut prüfen / reverify at write boundary
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 scripts/release_trust.py dist "$VERSION" "$GITHUB_REPOSITORY" "$EXPECTED_REF" "$EXPECTED_COMMIT"
      - name: Release-Entwurf / release draft
        if: needs.prepare.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          pre=()
          if [ "$IS_PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${pre[@]}" \
            --title "PQKeep $TAG" --notes-file "docs/releases/$TAG.md"
