name: OpenCode Authorization Gate Tests

on:
  push:
    branches:
      - security/opencode-issue-agent-hardening
  pull_request:
    paths:
      - 'scripts/authorize_opencode.py'
      - 'scripts/test_authorize_opencode.py'
      - 'scripts/validate_opencode_patch.py'
      - 'scripts/validate_opencode_patch_headers.py'
      - 'scripts/test_validate_opencode_patch_headers.py'
      - 'scripts/test_validate_opencode_patch.py'
      - 'scripts/verify_opencode_issue.py'
      - 'scripts/test_verify_opencode_issue.py'
      - 'scripts/test_opencode_patch_integration.py'
      - 'scripts/revalidate_opencode_event.py'
      - 'scripts/test_revalidate_opencode_event.py'
      - 'scripts/test_opencode_workflow_hold.py'
      - 'scripts/verify_opencode_artifact.py'
      - 'scripts/test_verify_opencode_artifact.py'
      - 'scripts/verify_opencode_sandbox.py'
      - 'scripts/test_verify_opencode_sandbox.py'
      - 'scripts/smoke_opencode_sandbox.py'
      - 'scripts/test_smoke_opencode_sandbox.py'
      - 'scripts/extract_opencode_artifact.py'
      - 'scripts/test_extract_opencode_artifact.py'
      - 'scripts/publisher_opencode_preflight.py'
      - 'scripts/test_publisher_opencode_preflight.py'
      - 'scripts/review_opencode_patch.py'
      - 'scripts/test_review_opencode_patch.py'
      - 'scripts/review_opencode_proposal.py'
      - 'scripts/test_review_opencode_proposal.py'
      - 'scripts/policy_opencode_publisher.py'
      - 'scripts/test_policy_opencode_publisher.py'
      - 'scripts/github_opencode_publisher_preflight.py'
      - 'scripts/test_github_opencode_publisher_preflight.py'
      - 'scripts/check_opencode_publisher_ready.py'
      - 'scripts/check_opencode_bound_publisher.py'
      - 'scripts/test_check_opencode_bound_publisher.py'
      - 'scripts/test_check_opencode_publisher_ready.py'
      - 'scripts/verify_opencode_run_provenance.py'
      - 'scripts/test_verify_opencode_run_provenance.py'
      - 'scripts/verify_opencode_artifact_origin.py'
      - 'scripts/test_verify_opencode_artifact_origin.py'
      - 'scripts/download_opencode_artifact.py'
      - 'scripts/test_download_opencode_artifact.py'
      - 'scripts/unpack_opencode_github_artifact.py'
      - 'scripts/test_unpack_opencode_github_artifact.py'
      - 'scripts/inspect_opencode_github_artifact.py'
      - 'scripts/test_inspect_opencode_github_artifact.py'
      - 'scripts/verify_opencode_trigger_comment.py'
      - 'scripts/test_verify_opencode_trigger_comment.py'
      - 'scripts/build_opencode_event_binding.py'
      - 'scripts/test_build_opencode_event_binding.py'
      - 'scripts/test_opencode_binding_chain.py'
      - 'scripts/sign_opencode_verified_event.py'
      - 'scripts/test_sign_opencode_verified_event.py'
      - 'scripts/attest_opencode_event.py'
      - 'scripts/test_attest_opencode_event.py'
      - 'scripts/verify_opencode_event_binding.py'
      - 'scripts/test_verify_opencode_event_binding.py'
      - '.github/workflows/opencode.yml'
      - '.github/workflows/opencode-gate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify authorization scenarios
        run: python3 -m unittest discover -s scripts -p 'test_*opencode*.py' -v
