# DE: CI: Format, Lints, Tests auf Linux (aktuell und Ubuntu 22.04 = Basis der Release-Builds)
#     und Windows, MSRV, Zeilenlimits, Binär-Härtung, cargo-deny, gitleaks (ganze Historie).
#     Releases: release.yml. CodeQL: codeql.yml.
# EN: CI: format, lints, tests on Linux (current and Ubuntu 22.04 = base of release builds)
#     and Windows, MSRV, line limits, binary hardening, cargo-deny, gitleaks (full history).
#     Releases: release.yml. CodeQL: codeql.yml.
name: CI

# DE: Push nur auf main; Branches laufen über den Pull Request (keine Doppelläufe).
# EN: Push on main only; branches run via the pull request (no duplicate runs).
on:
  push:
    branches: [main, security/opencode-issue-agent-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

jobs:
  test:
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # DE: ubuntu-22.04 (glibc 2.35) ist die Basis der Linux-Release-Builds; dort müssen
        #     Sandbox und Seccomp-Liste ebenfalls funktionieren.
        # EN: ubuntu-22.04 (glibc 2.35) is the base of Linux release builds; the sandbox and
        #     seccomp list must work there as well.
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DE: Toolchain laut rust-toolchain.toml über das vorinstallierte rustup.
      # EN: Toolchain per rust-toolchain.toml via the preinstalled rustup.
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Native ARM64-Umgebung
        if: matrix.os == 'ubuntu-22.04-arm'
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          uname -a
          getconf PAGESIZE
          getconf GNU_LIBC_VERSION
          rustc -vV
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # DE: Reine CLI ohne API/Netzwerkcode muss baubar bleiben.
      # EN: The pure CLI without API/network code must stay buildable.
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --locked
      # DE: Referenztests zum v2-Formatentwurf (nur Standardbibliothek).
      # EN: Reference tests for the v2 format draft (standard library only).
      - name: v2-Formatentwurf / v2 format draft
        shell: bash
        run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" -m unittest discover -s scripts -p 'test_v2_*.py' -v

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo "+$MSRV" check --all-targets --locked

  limits:
    name: Zeilenlimits / line limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check_limits.sh
      - run: bash scripts/test_check_limits.sh
      - run: python3 scripts/test_check_binary.py
      - run: python3 -m unittest discover -s scripts -p 'test_release_elf.py' -v

  binary:
    name: Binär-Härtung / binary hardening (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked
      # DE: Linux: PIE, Full RELRO, NX. Windows: ASLR, DEP, Control Flow Guard.
      # EN: Linux: PIE, full RELRO, NX. Windows: ASLR, DEP, Control Flow Guard.
      - run: |
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          bins=target/release/pqkeep
          # DE: Windows: auch das Startprogramm pqkeepw.exe. EN: Windows: also the launcher pqkeepw.exe.
          [ -f "$bins.exe" ] && bins="target/release/pqkeep.exe target/release/pqkeepw.exe"
          for bin in $bins; do "$py" scripts/check_binary.py "$bin"; done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # DE: SHA-256 des offiziellen Release-Archivs (Prüfsummendatei, GitHub-Digest und eigener
      #     Hash am 07.11.2026 übereinstimmend). Kein Drittanbieter-Action-Code.
      # EN: SHA-256 of the official release archive (checksum file, GitHub digest and own hash
      #     matched on 2026-11-07). No third-party action code.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks installieren / install
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (ganze Historie / full history)
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .'
