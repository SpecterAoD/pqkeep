# DE: CI-Rumpf (Schritt 0): Format, Lints, Tests auf Linux und Windows, MSRV,
#     Zeilenlimits, Binär-Härtung, cargo-deny. Ausbau (gitleaks, Fuzzing, Release) in Schritt 6.
# EN: CI skeleton (step 0): format, lints, tests on Linux and Windows, MSRV,
#     line limits, binary hardening, cargo-deny. Extended (gitleaks, fuzzing, release) in step 6.
name: CI

# DE: Push nur auf main; Branches laufen über den Pull Request (keine Doppelläufe).
# EN: Push on main only; branches run via the pull request (no duplicate runs).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

jobs:
  test:
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DE: Toolchain laut rust-toolchain.toml über das vorinstallierte rustup.
      # EN: Toolchain per rust-toolchain.toml via the preinstalled rustup.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # DE: Reine CLI ohne API/Netzwerkcode muss baubar bleiben.
      # EN: The pure CLI without API/network code must stay buildable.
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo "+$MSRV" check --all-targets --locked

  limits:
    name: Zeilenlimits / line limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check_limits.sh
      - run: bash scripts/test_check_limits.sh
      - run: python3 scripts/test_check_binary.py

  binary:
    name: Binär-Härtung / binary hardening (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked
      # DE: Linux: PIE, Full RELRO, NX. Windows: ASLR, DEP, Control Flow Guard.
      # EN: Linux: PIE, full RELRO, NX. Windows: ASLR, DEP, Control Flow Guard.
      - run: |
          bin=target/release/keyforge
          [ -f "$bin.exe" ] && bin="$bin.exe"
          if command -v python3 >/dev/null; then py=python3; else py=python; fi
          "$py" scripts/check_binary.py "$bin"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check
