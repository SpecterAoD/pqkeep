name: OpenCode authorization gate (inactive)
# Security-only stage: no Gemini, no GitHub writes, no secrets.
# issue_comment workflows execute from the default branch after merge.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.repository == 'SpecterAoD/pqkeep' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 77644070 &&
      github.event.sender.id == 77644070 &&
      (startsWith(github.event.comment.body, '/oc plan ') ||
       startsWith(github.event.comment.body, '/oc review ') ||
       startsWith(github.event.comment.body, '/oc explain ') ||
       startsWith(github.event.comment.body, '/oc implement '))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests
        run: python3 -m unittest discover -s tests -p 'test_oc_gate.py' -v
      - name: Validate OpenCode V2 analysis policy\n        run: python3 -m unittest discover -s tests -p 'test_opencode_config.py' -v\n      - name: Check triggering event
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OC_VERIFY_LIVE: '1'
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/oc_gate.py "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY"
